<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경제 실험실</title>
<link rel="stylesheet" href="../shared/common.css">
<style>
  .qcard h2 { font-size: 1.35rem; margin-bottom: 14px; }
  .explain { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: #f3efe4; font-weight: 600; }
  .result-delta { font-size: 3rem; font-weight: 900; font-variant-numeric: tabular-nums; }
  .wait { padding: 30px 10px; }
</style>
</head>
<body>
<div class="student">
  <div class="topbar" style="margin-bottom:12px">
    <div class="brand">🧪 경제 실험실</div><div class="grow"></div><span id="mode"></span>
  </div>

  <!-- 입장 -->
  <div id="joinView" class="card">
    <h2>수업에 들어가기</h2>
    <div class="field"><label>수업 코드 (숫자 4자리)</label><input id="codeIn" inputmode="numeric" maxlength="4" placeholder="예: 1234"></div>
    <div style="height:10px"></div>
    <div class="field"><label>이름 (번호+이름)</label><input id="nameIn" maxlength="12" placeholder="예: 7 김임실"></div>
    <div style="height:14px"></div>
    <button class="btn huge accent" id="joinBtn">들어가기</button>
    <p class="muted" id="joinMsg"></p>
  </div>

  <!-- 게임 -->
  <div id="gameView" class="hidden">
    <div class="status-line">
      <div><span class="muted">나</span> <b id="meName"></b></div>
      <div class="money" id="meCash"></div>
    </div>
    <div class="card" id="screen"></div>
  </div>
</div>

<script type="module">
import { createBackend, $, esc, won, signed, shuffle, modeBadge } from "../shared/backend.js";
import { ROUNDS, TAX_OPTIONS, START_CASH, PER_CORRECT } from "./rounds.js";
import { QUESTIONS } from "./questions.js";

const GAME = "lab";
let be, code, room = null, me = null, players = {};
let deck = [], qi = 0, local = { seq: -1, produced: 0, correct: 0, tried: 0 }, lockUntil = 0, feedback = null;

function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2000); }

(async () => {
  try { be = await createBackend(); }
  catch (e) { $("#joinMsg").textContent = "서버에 연결하지 못했어요. 선생님께 알려 주세요."; console.error(e); return; }
  $("#mode").innerHTML = modeBadge(be);
  const saved = JSON.parse(localStorage.getItem("econ-lab-me") || "null");
  if (saved) { $("#codeIn").value = saved.code; $("#nameIn").value = saved.name; }
})();

$("#joinBtn").onclick = join;
$("#nameIn").onkeydown = (e) => e.key === "Enter" && join();

async function join() {
  const c = $("#codeIn").value.trim(), name = $("#nameIn").value.trim();
  if (!/^\d{4}$/.test(c)) return ($("#joinMsg").textContent = "수업 코드 4자리를 확인해 주세요.");
  if (!name) return ($("#joinMsg").textContent = "이름을 입력해 주세요.");
  if (!be) return;
  const r = await be.getRoom(GAME, c);
  if (!r) return ($("#joinMsg").textContent = "그런 수업 코드가 없어요. 선생님 화면의 코드를 확인해 주세요.");
  code = c;
  localStorage.setItem("econ-lab-me", JSON.stringify({ code: c, name }));
  await be.updatePlayer(GAME, c, be.uid, { name, joinedAt: Date.now() });
  $("#joinView").classList.add("hidden");
  $("#gameView").classList.remove("hidden");
  $("#meName").textContent = name;
  be.watchRoom(GAME, c, (rr) => { room = rr; render(); });
  be.watchPlayers(GAME, c, (ps) => {
    players = ps || {};
    me = players[be.uid] || null;
    if (!me && room) { $("#screen").innerHTML = `<div class="center wait"><div class="big-emoji">🚪</div><h2>선생님이 내보냈어요</h2><p class="muted">다시 들어가려면 새로고침하세요.</p></div>`; return; }
    render();
  });
}

const round = () => ROUNDS[room.roundIdx] || ROUNDS[0];
const left = () => (room && room.endsAt ? Math.ceil((room.endsAt - Date.now()) / 1000) : null);

function setupDeck() {
  const sets = (room.settings && room.settings.sets) || [1, 2, 3, 4];
  deck = shuffle(QUESTIONS.filter((q) => sets.includes(q.set)));
  qi = 0;
}

let lastKey = "";
function render() {
  if (!room || !me) return;
  $("#meCash").textContent = won(me.cash ?? START_CASH);
  // 같은 화면이면 다시 그리지 않음 (문제 푸는 중 깜빡임 방지)
  const key = [room.phase, room.seq, room.roundIdx, me.choiceSeq, me.choice, me.voteSeq, me.vote, me.last && me.last.seq, me.cash, room.taxRate].join("|");
  if (room.phase === "work") { renderWork(); lastKey = key; return; }
  if (key === lastKey) return;
  lastKey = key;
  const r = round(), s = $("#screen");
  const head = `<div class="center"><div class="muted">${room.roundIdx + 1}라운드</div><div class="big-emoji">${r.emoji}</div><h2>${r.title}</h2></div>`;

  if (room.phase === "lobby") {
    s.innerHTML = `<div class="center wait"><div class="big-emoji">⏳</div><h2>입장 완료!</h2><p>선생님이 시작할 때까지 기다려요.<br>처음 가진 돈은 <b>${won(START_CASH)}</b>이에요.</p></div>`;
  } else if (room.phase === "intro") {
    s.innerHTML = `${head}<p style="font-size:1.15rem">${r.rule}</p><div class="explain">🤔 ${r.think}</div><p class="muted center">선생님 설명을 들어요.</p>`;
  } else if (room.phase === "vote") {
    const mine = me.voteSeq === room.seq ? me.vote : null;
    s.innerHTML = `${head}<h3>세금을 얼마나 걷을까요?</h3><p class="muted">번 돈에서 세금을 내고, 모인 세금은 모두에게 똑같이 나눠 줘요.</p>
      <div class="choices">${TAX_OPTIONS.map((o) => `<button class="choice-btn ${mine === o.v ? "sel" : ""}" data-vote="${o.v}">${o.sub} · ${o.label}</button>`).join("")}</div>
      <p class="center timer" data-timer style="font-size:1.4rem"></p>`;
    s.querySelectorAll("[data-vote]").forEach((b) => (b.onclick = () => {
      if (left() !== null && left() <= 0) return toast("투표 시간이 끝났어요");
      be.updatePlayer(GAME, code, be.uid, { vote: +b.dataset.vote, voteSeq: room.seq });
    }));
  } else if (room.phase === "choose") {
    const mine = me.choiceSeq === room.seq ? me.choice : null;
    s.innerHTML = `${head}<p>${r.rule}</p>
      <div class="choices two">${r.options.map((o) => `<button class="choice-btn ${mine === o.v ? "sel" : ""}" data-choice="${o.v}">${o.label}<small>${o.sub}</small></button>`).join("")}</div>
      <p class="center muted" style="margin-top:10px">${mine ? "선택 완료! 시간 안에는 바꿀 수 있어요." : "친구에게 보여주지 말고 몰래 골라요."}</p>
      <p class="center timer" data-timer style="font-size:1.4rem"></p>`;
    s.querySelectorAll("[data-choice]").forEach((b) => (b.onclick = () => {
      if (left() !== null && left() <= 0) return toast("선택 시간이 끝났어요");
      be.updatePlayer(GAME, code, be.uid, { choice: b.dataset.choice, choiceSeq: room.seq });
    }));
  } else if (room.phase === "result") {
    const L = me.last && me.last.seq === room.seq ? me.last : null;
    s.innerHTML = `${head}${L ? `<div class="center"><div class="muted">이번 라운드</div><div class="result-delta ${L.delta < 0 ? "neg" : "pos"}">${signed(L.delta)}</div><p>${esc(L.note)}</p></div>` : `<p class="center muted">이번 라운드에는 참여하지 않았어요.</p>`}
      <div class="explain">📖 ${r.concept}</div><p class="center muted">선생님 화면에서 반 전체 결과를 봐요.</p>`;
  } else if (room.phase === "end") {
    const rows = Object.values(players).map((p) => p.cash ?? START_CASH).sort((a, b) => b - a);
    const rank = rows.indexOf(me.cash ?? START_CASH) + 1;
    s.innerHTML = `<div class="center wait"><div class="big-emoji">🏆</div><h2>게임 끝!</h2><p>내 최종 재산</p><div class="result-delta">${won(me.cash ?? START_CASH)}</div><p>${rows.length}명 중 <b>${rank}등</b></p></div>`;
  }
  tick();
}

/* ---------- 문제 풀기 ---------- */
function renderWork() {
  if (local.seq !== room.seq) {
    const mineSaved = me.seq === room.seq;
    local = { seq: room.seq, produced: mineSaved ? me.produced || 0 : 0, correct: mineSaved ? me.correct || 0 : 0, tried: mineSaved ? me.tried || 0 : 0 };
    setupDeck(); feedback = null;
    $("#screen").dataset.view = "";
  }
  const s = $("#screen");
  const r = round();
  const over = left() !== null && left() <= 0;
  if (over) {
    if (s.dataset.view !== "over") {
      s.dataset.view = "over";
      s.innerHTML = `<div class="center wait"><div class="big-emoji">⏰</div><h2>시간 끝!</h2><p>이번 라운드 생산: <b>${won(local.produced)}</b> (${local.correct}문제 맞힘)</p><p class="muted">선생님 화면을 봐요.</p></div>`;
    }
    return;
  }
  if (s.dataset.view === "q" + qi + (feedback ? "f" : "")) return;
  s.dataset.view = "q" + qi + (feedback ? "f" : "");
  if (qi >= deck.length) { setupDeck(); }
  const q = deck[qi];
  s.innerHTML = `
    <div class="row"><span class="chip">${r.emoji} ${r.title}</span><div class="grow"></div><span class="timer" data-timer style="font-size:1.5rem"></span></div>
    <div class="row" style="margin:10px 0 16px"><span>이번 라운드 생산 <b class="money">${won(local.produced)}</b></span><div class="grow"></div><span class="muted">${local.correct}/${local.tried} 맞힘</span></div>
    ${r.id === "plan" ? `<div class="explain" style="margin:0 0 14px">⚠️ 번 돈은 반 전체가 똑같이 나눠 가져요</div>` : ""}
    ${r.id === "mixed" ? `<div class="explain" style="margin:0 0 14px">세율 ${room.taxRate}% — 번 돈의 ${room.taxRate}%는 세금으로 내요</div>` : ""}
    <div class="qcard"><h2>${esc(q.q)}</h2>
      <div class="choices">${q.o.map((o, i) => {
        let cls = "";
        if (feedback) cls = i === q.a ? "right" : i === feedback.pick ? "wrong" : "";
        return `<button class="choice-btn ${cls}" data-ans="${i}" ${feedback ? "disabled" : ""}>${esc(o)}</button>`;
      }).join("")}</div>
      ${feedback ? `<div class="explain">${feedback.ok ? "⭕ 정답! +" + PER_CORRECT + "원" : "❌ 아쉬워요"} · ${esc(q.e)}</div>` : ""}
    </div>`;
  s.querySelectorAll("[data-ans]").forEach((b) => (b.onclick = () => answer(+b.dataset.ans)));
  tick();
}

function answer(i) {
  if (feedback || Date.now() < lockUntil) return;
  const q = deck[qi];
  const ok = i === q.a;
  local.tried++;
  if (ok) { local.correct++; local.produced += PER_CORRECT; }
  feedback = { ok, pick: i };
  be.updatePlayer(GAME, code, be.uid, { seq: room.seq, produced: local.produced, correct: local.correct, tried: local.tried });
  renderWork();
  // 정답은 빨리, 오답은 해설을 읽도록 조금 더 오래 보여 줌
  lockUntil = Date.now() + (ok ? 700 : 2200);
  setTimeout(() => { feedback = null; qi++; if (room.phase === "work") renderWork(); }, ok ? 700 : 2200);
}

function tick() {
  const s = left();
  document.querySelectorAll("[data-timer]").forEach((el) => {
    el.textContent = s === null ? "" : s > 0 ? `⏱ ${s}초` : "시간 끝!";
    el.classList.toggle("low", s !== null && s <= 10);
  });
  if (room && room.phase === "work" && s !== null && s <= 0 && $("#screen").dataset.view !== "over") renderWork();
}
setInterval(tick, 250);
</script>
</body>
</html>
